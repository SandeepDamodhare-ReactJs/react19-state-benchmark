<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React 19 State Management Benchmark</title>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; margin: 16px; background: #f8fafc; color: #0f172a; }
      .controls { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
      input, button { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
      button { background: #1e3a8a; color: white; cursor: pointer; font-weight: 600; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
      .card { background: white; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px 10px; font-size: 12px; }
      .card.selected { border-color: #2563eb; background: #eff6ff; }
      .price { font-weight: 700; font-variant-numeric: tabular-nums; }
      .up { color: #15803d; }
      .down { color: #b91c1c; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
